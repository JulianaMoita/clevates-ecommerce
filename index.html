<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Clevates E-commerce</title>

  <link rel="stylesheet" href="css/import.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>

<body>

  <nav class="container flex-horizontal menu">
    <ul class="flex-horizontal">
      <li>Home</li>
      <li>Lançamento</li>
      <li>Sale</li>
    </ul>
    <input id="busca" type="text" placeholder="Pesquisar">
    <button>Cadastre-se</button>
  </nav>

  <section class="container flex-vertical banner">
    <div class="flex-horizontal banner-box-1">
      <h2 class="syne-google-font">Edição <br> Limitada</h2>
      <h2 class="syne-google-font">A nova Era</h2>
      <h2 class="syne-google-font">Street <br> Carioca</h2>
    </div>
    <div class="banner-box-2">
      <div class="vazio">
        <h2>vazio</h2>
      </div>
      <h1 class="syne-google-font">CLEVATES</h1>
      <a href="#" class="flex-horizontal">
        <h2 class="syne-google-font">Confira</h2>
        <svg xmlns="http://www.w3.org/2000/svg" height="36px" viewBox="0 -960 960 960" width="36px" fill="#000"><path d="m480-320 160-160-56-56-64 64v-168h-80v168l-64-64-56 56 160 160Zm0 240q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/></svg>
      </a>
    </div>
  </section>

  <section class="container cards">
    <div class="grid-cards">
      <div class="card-categoria camisetas">
        <h3 class="syne-google-font">Camisetas</h3>
        <button>Ver mais</button>
      </div>
      <div class="card-categoria bermudas">
        <h3 class="syne-google-font">bermuda</h3>
        <button>Ver mais</button>
      </div>
      <div class="card-categoria moletom">
        <h3 class="syne-google-font">moletom</h3>
        <button>Ver mais</button>
      </div>
      <div class="card-categoria social">
        <h3 class="syne-google-font">social</h3>
        <button>Ver mais</button>
      </div>
    </div>
  </section>

</body>
</html>
